  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

der: 2px solid rgba(255,255,255,.22); color: #fff; font-weight: 800; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; padding: 8px 16px; border-radius: 999px\"><i class=\"ix-anim\" style=\"width: 9px; height: 9px; border-radius: 50%; background: #FF6B4A; animation: ix-pulse 1.8s infinite\"><\u002Fi>Proposta para parceiros<\u002Fspan>\n        <h1 style=\"margin: 26px 0 22px; font-family: 'Bricolage Grotesque', Nunito, sans-serif; font-weight: 800; font-size: clamp(46px, 6.6vw, 88px); line-height: .98; letter-spacing: -.025em; text-wrap: balance\">Uma nova <span style=\"position: relative; display: inline-block; color: #FFC53D\">jornada<svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 300 24\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position: absolute; left: 0; right: 0; bottom: -12px; width: 100%; height: 18px\"><path d=\"M4 14 C 40 2, 70 22, 110 12 S 180 2, 220 12 S 280 20, 296 8\" fill=\"none\" stroke=\"#FF6B4A\" stroke-width=\"7\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan> para a Educação Especial Inclusiva.<\u002Fh1>\n        <p style=\"margin: 0 0 32px; font-size: clamp(18px, 1.6vw, 21px); max-width: 34em; color: #D9D4FF\">Cada estudante chega de um jeito. Nossa proposta conecta gestão, pessoas e tecnologia para que todos avancem no mesmo tabuleiro, com os apoios certos em cada casa.<\u002Fp>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 14px\">\n          <a class=\"ix-btn\" href=\"#cartas\" style=\"display: inline-block; text-decoration: none; font-weight: 800; font-size: 16px; color: #1C1B3A; background: #FF6B4A; padding: 17px 30px; border-radius: 18px; box-shadow: 0 5px 0 #C9431F\">Quero construir junto<\u002Fa>\n          <a class=\"ix-btn\" href=\"#jornada\" style=\"display: inline-block; text-decoration: none; font-weight: 800; font-size: 16px; color: #fff; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.3); padding: 15px 28px; border-radius: 18px\">Ver a jornada<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex: 0 1 440px; min-width: 0; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 16px\">\n        <div role=\"img\" aria-label=\"Mosaico de peças geométricas coloridas, todas diferentes, formando um único quadro\" style=\"width: min(100%, 440px); aspect-ratio: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; transform: rotate(-3deg)\">\n          <sc-for list=\"{{tiles}}\" as=\"t\" hint-placeholder-count=\"16\">\n            <div style=\"{{t.cell}}\"><span class=\"ix-shape\" style=\"{{t.shape}}\"><\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button class=\"ix-btn\" type=\"button\" sc-camel-on-click=\"{{mix}}\" style=\"display: inline-flex; align-items: center; gap: 10px; font: 800 14px Nunito, sans-serif; color: #fff; background: transparent; border: 2px dashed rgba(255,255,255,.35); padding: 12px 20px; border-radius: 999px; cursor: pointer; min-height: 44px\">\n          <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 3h5v5\"><\u002Fpath><path d=\"M4 20 21 3\"><\u002Fpath><path d=\"M21 16v5h-5\"><\u002Fpath><path d=\"M15 15l6 6\"><\u002Fpath><path d=\"M4 4l5 5\"><\u002Fpath><\u002Fsvg>\n          Misturar as peças\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===================== FAIXA ===================== -->\n  <div aria-hidden=\"true\" style=\"position: relative; z-index: 2; margin-top: -26px; transform: rotate(-1.6deg); background: #FF6B4A; color: #1C1B3A; padding: 16px 0; overflow: hidden; box-shadow: 0 6px 0 #C9431F\">\n    <div class=\"ix-anim\" style=\"display: flex; width: max-content; gap: 36px; animation: ix-marquee 28s linear infinite; font-family: 'Bricolage Grotesque', Nunito, sans-serif; font-weight: 800; font-size: 26px; white-space: nowrap\">\n      <span>Tecnologia<\u002Fspan><span>✦<\u002Fspan><span>Conhecimento<\u002Fspan><span>✦<\u002Fspan><span>Transformação<\u002Fspan><span>✦<\u002Fspan><span>Estudante no centro<\u002Fspan><span>✦<\u002Fspan><span>Jornada progressiva<\u002Fspan><span>✦<\u002Fspan><span>Foco na prática<\u002Fspan><span>✦<\u002Fspan>\n      <span>Tecnologia<\u002Fspan><span>✦<\u002Fspan><span>Conhecimento<\u002Fspan><span>✦<\u002Fspan><span>Transformação<\u002Fspan><span>✦<\u002Fspan><span>Estudante no centro<\u002Fspan><span>✦<\u002Fspan><span>Jornada progressiva<\u002Fspan><span>✦<\u002Fspan><span>Foco na prática<\u002Fspan><span>✦<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <main style=\"position: relative; z-index: 1\">\n\n    <!-- ===================== DESAFIO: antes / depois ===================== -->\n    <section id=\"desafio\" style=\"max-width: 1200px; margin: 0 auto; padding: clamp(72px, 9vw, 120px) clamp(16px, 4vw, 48px) clamp(40px, 6vw, 72px)\">\n      <div style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px 48px; margin-bottom: 40px\">\n        <div style=\"flex: 1 1 520px; min-width: 0\">\n          <p style=\"margin: 0 0 12px; font-weight: 800; font-size: 14px; letter-spacing: .16em; text-transform: uppercase; color: #6A4CF5\">01 · O desafio<\u002Fp>\n          <h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', Nunito, sans-serif; font-weight: 800; font-size: clamp(34px, 4.6vw, 58px); line-height: 1.02; letter-spacing: -.02em; text-wrap: balance\">Incluir vai além de ferramentas: exige ver a rede inteira.<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"flex: 1 1 340px; min-width: 0; margin: 0; font-size: 18px; color: #4A4870\">Redes, escolas, profissionais, estudantes e famílias precisam atuar juntos. Hoje, a informação se perde no caminho.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 22px\">\n        <article style=\"background: #fff; border: 2px solid #E4E0F7; border-radius: 32px; padding: 28px; display: flex; flex-direction: column; gap: 18px\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px\">\n            <h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', Nunito, sans-serif; font-weight: 800; font-size: 26px\">O que vemos hoje<\u002Fh3>\n            <span style=\"font-weight: 800; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #6B6890; background: #EFEDF7; padding: 6px 12px; border-radius: 999px\">Ilhas<\u002Fspan>\n          <\u002Fdiv>\n          <div aria-hidden=\"true\" style=\"position: relative; height: 260px; border-radius: 22px; background: #F3F2F8; background-image: radial-gradient(#DAD7EA 1.2px, transparent 1.2px); background-size: 18px 18px\">\n            <span style=\"position: absolute; left: 10%; top: 14%; padding: 8px 14px; border-radius: 999px; border: 2px dashed #B9B6CF; color: #6B6890; font-weight: 800; font-size: 14px; background: #fff\">Gestão<\u002Fspan>\n            <span style=\"position: absolute; right: 8%; top: 10%; padding: 8px 14px; border-radius: 6px; border: 2px dashed #B9B6CF; color: #6B6890; font-weight: 800; font-size: 14px; background: #fff; transform: rotate(6deg)\">Escola<\u002Fspan>\n            <span style=\"position: absolute; left: 40%; top: 42%; padding: 8px 14px; border-radius: 999px 999px 6px 6px; border: 2px dashed #B9B6CF; color: #6B6890; font-weight: 800; font-size: 14px; background: #fff; transform: rotate(-5deg)\">AEE<\u002Fspan>\n            <span style=\"position: absolute; left: 6%; bottom: 14%; padding: 8px 14px; border-radius: 6px; border: 2px dashed #B9B6CF; color: #6B6890; font-weight: 800; font-size: 14px; background: #fff; transform: rotate(-8deg)\">Professores<\u002Fspan>\n            <span style=\"position: absolute; right: 12%; bottom: 12%; padding: 8px 14px; border-radius: 999px; border: 2px dashed #B9B6CF; color: #6B6890; font-weight: 800; font-size: 14px; background: #fff; transform: rotate(4deg)\">Família<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin: 0; color: #4A4870\">Serviços desarticulados, dados espalhados e pouca visibilidade sobre a evolução das ações.<\u002Fp>\n        <\u002Farticle>\n\n        <article style=\"background: #6A4CF5; color: #fff; border-radius: 32px; padding: 28px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 8px 0 #4B2FD1\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px\">\n            <h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', Nunito, sans-serif; font-weight: 800; font-size: 26px\">O que propomos<\u002Fh3>\n            <span style=\"font-weight: 800; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #1C1B3A; background: #FFC53D; padding: 6px 12px; border-radius: 999px\">Rede<\u002Fspan>\n          <\u002Fdiv>\n          <div aria-hidden=\"true\" style=\"position: relative; height: 260px; border-radius: 22px; background: #5A3CE6\">\n            <svg sc-camel-view-box=\"0 0 100 100\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position: absolute; inset: 0; width: 100%; height: 100%\">\n              <g stroke=\"#B7A8FF\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" fill=\"none\">\n                <path d=\"M50 50 L18 20\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n                <path d=\"M50 50 L82 18\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n                <path d=\"M50 50 L16 80\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n                <path d=\"M50 50 L84 80\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n                <path d=\"M18 20 L82 18 M16 80 L84 80\" stroke-dasharray=\"4 5\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n              <\u002Fg>\n            <\u002Fsvg>\n            <span style=\"position: absolute; left: 18%; top: 20%; transform: translate(-50%, -50%); padding: 8px 14px; border-radius: 999px; background: #3DDBB8; color: #1C1B3A; font-weight: 800; font-size: 14px\">Gestão<\u002Fspan>\n            <span style=\"position: absolute; left: 82%; top: 18%; transform: translate(-50%, -50%); padding: 8px 14px; border-radius: 6px; background: #FFC53D; color: #1C1B3A; font-weight: 800; font-size: 14px\">Escola<\u002Fspan>\n            <span style=\"position: absolute; left: 16%; top: 80%; transform: translate(-50%, -50%); padding: 8px 14px; border-radius: 6px; background: #FF9EC7; color: #1C1B3A; font-weight: 800; font-size: 14px\">Professores<\u002Fspan>\n            <span style=\"position: absolute; left: 84%; top: 80%; transform: translate(-50%, -50%); padding: 8px 14px; border-radius: 999px; background: #FF6B4A; color: #1C1B3A; font-weight: 800; font-size: 14px\">Família<\u002Fspan>\n            <span style=\"position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 96px; height: 96px; border-radius: 50%; background: #fff; color: #1C1B3A; display: flex; align-items: center; justify-content: center; text-align: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 14px; line-height: 1.1; box-shadow: 0 0 0 8px rgba(255,255,255,.18)\">Estudante<br>+ AEE<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin: 0; color: #EAE5FF\">Um ecossistema que apoia decisões, fortalece práticas e dá continuidade à trajetória de cada estudante.<\u002Fp>\n        <\u002Farticle>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ===================== VISÃO: Venn ===================== -->\n    <section id=\"visao\" style=\"max-width: 1200px; margin: 0 auto; padding: clamp(40px, 6vw, 72px) clamp(16px, 4vw, 48px)\">\n      <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: clamp(32px, 5vw, 72px)\">\n        <div style=\"flex: 1 1 380px; min-width: 0\">\n          <p style=\"margin: 0 0 12px; font-weight: 800; font-size: 14px; letter-spacing: .16em; text-transform: uppercase; color: #6A4CF5\">02 · Nossa visão<\u002Fp>\n          <h2 style=\"margin: 0 0 18px; font-family: 'Bricolage Grotesque', Nunito, sans-serif; font-weight: 800; font-size: clamp(34px, 4.6vw, 58px); line-height: 1.02; letter-spacing: -.02em\">Onde três forças se encontram, nasce o ecossistema.<\u002Fh2>\n          <p style=\"margin: 0 0 26px; font-size: 18px; color: #4A4870\">Tecnologia sozinha não transforma. Conhecimento sem acompanhamento não se sustenta. A proposta junta as três.<\u002Fp>\n          <div style=\"display: flex; flex-direction: column; gap: 14px\">\n            <div style=\"display: flex; gap: 14px; align-items: flex-start\"><span aria-hidden=\"true\" style=\"flex: 0 0 auto; width: 18px; height: 18px; margin-top: 4px; border-radius: 50%; background: #6A4CF5\"><\u002Fspan><p style=\"margin: 0\"><b style=\"font-weight: 800\">Tecnologia<\u002Fb> · conectar informações, processos e pessoas em uma experiência integrada.<\u002Fp><\u002Fdiv>\n            <div style=\"display: flex; gap: 14px; align-items: flex-start\"><span aria-hidden=\"true\" style=\"flex: 0 0 auto; width: 18px; height: 18px; margin-top: 4px; border-radius: 50%; background: #FF6B4A\"><\u002Fspan><p style=\"margin: 0\"><b style=\"font-weight: 800\">Conhecimento<\u002Fb> · fortalecer competências e apoiar a construção de práticas inclusivas.<\u002Fp><\u002Fdiv>\n            <div style=\"display: flex; gap: 14px; align-items: flex-start\"><span aria-hidden=\"true\" style=\"flex: 0 0 auto; width: 18px; height: 18px; margin-top: 4px; border-radius: 50%; background: #2BC4A1\"><\u002Fspan><p style=\"margin: 0\"><b style=\"font-weight: 800\">Transformação<\u002Fb> · acompanhar a evolução da rede e estimular a melhoria contínua.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 420px; min-width: 0; display: flex; justify-content: center\">\n          <div role=\"img\" aria-label=\"Três círculos sobrepostos: Tecnologia, Conhecimento e Transformação, com Ecossistema no centro\" style=\"position: relative; width: min(100%, 500px); aspect-ratio: 500 / 460\">\n            <span style=\"position: absolute; left: 0; top: 0; width: 58%; aspect-ratio: 1; border-radius: 50%; background: #6A4CF5; opacity: .9; mix-blend-mode: multiply\"><\u002Fspan>\n            <span style=\"position: absolute; right: 0; top: 0; width: 58%; aspect-ratio: 1; border-radius: 50%; background: #FF6B4A; opacity: .9; mix-blend-mode: multiply\"><\u002Fspan>\n            <span style=\"position: absolute; left: 21%; bottom: 0; width: 58%; aspect-ratio: 1; border-radius: 50%; background: #3DDBB8; opacity: .95; mix-blend-mode: multiply\"><\u002Fspan>\n            <span style=\"position: absolute; left: 13%; top: 22%; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(15px, 2vw, 22px); color: #fff\">Tecnologia<\u002Fspan>\n            <span style=\"position: absolute; right: 9%; top: 22%; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(15px, 2vw, 22px); color: #1C1B3A\">Conhecimento<\u002Fspan>\n            <span style=\"position: absolute; left: 50%; bottom: 13%; transform: translateX(-50%); font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(15px, 2vw, 22px); color: #1C1B3A\">Transformação<\u002Fspan>\n            <span class=\"ix-anim\" style=\"position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); background: #fff; color: #1C1B3A; font-weight: 800; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; padding: 9px 14px; border-radius: 999px; box-shadow: 0 4px 0 #1C1B3A; border: 2px solid #1C1B3A; white-space: nowrap\">Ecossistema<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ===================== JORNADA: tabuleiro ===================== -->\n    <section id=\"jornada\" style=\"max-width: 1200px; margin: 0 auto; padding: clamp(40px, 6vw, 72px) clamp(16px, 4vw, 48px)\">\n      <div style=\"background: #fff; border: 2px solid #E4E0F7; border-radius: 40px; padding: clamp(24px, 4.5vw, 56px); box-shadow: 0 10px 0 #E4E0F7\">\n        <div style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 40px; margin-bottom: 36px\">\n          <div style=\"flex: 1 1 460px; min-width: 0\">\n            <p style=\"margin: 0 0 12px; font-weight: 800; font-size: 14px; letter-spacing: .16em; text-transform: uppercase; color: #6A4CF5\">03 · A jornada<\u002Fp>\n            <h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', Nunito, sans-serif; font-weight: 800; font-size: clamp(34px, 4.6vw, 58px); line-height: 1.02; letter-spacing: -.02em\">Seis casas, no ritmo de cada rede.<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"flex: 1 1 300px; min-width: 0; margin: 0; font-size: 18px; color: #4A4870\">A rede começa de onde está e avança respeitando suas prioridades. Escolha uma casa.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px\">\n          <sc-for list=\"{{steps}}\" as=\"s\" hint-placeholder-count=\"6\">\n            <button class=\"ix-tile\" type=\"button\" sc-camel-on-click=\"{{s.pick}}\" aria-pressed=\"{{s.pressed}}\" style=\"{{s.tileStyle}}\">\n              <span style=\"display: flex; align-items: center; justify-content: space-between; width: 100%\">\n                <span style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; line-height: 1\">{{s.n}}<\u002Fspan>\n                <span aria-hidden=\"true\" style=\"{{s.iconStyle}}\"><\u002Fspan>\n              <\u002Fspan>\n              <span style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 19px; line-height: 1.15; text-align: left\">{{s.title}}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div aria-hidden=\"true\" style=\"margin: 22px 0 0; height: 10px; border-radius: 999px; background: #EFEDF7; overflow: hidden\">\n          <span style=\"{{progressStyle}}\"><\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"{{cur.panelStyle}}\">\n          <span aria-hidden=\"true\" style=\"{{cur.bigShape}}\"><\u002Fspan>\n          <div style=\"flex: 1 1 360px; min-width: 0\">\n            <p style=\"margin: 0 0 6px; font-weight: 800; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; opacity: .8\">Casa {{cur.n}} de 6<\u002Fp>\n            <h3 style=\"margin: 0 0 8px; font-family: 'Bricolage Grotesque', Nunito, sans-serif; font-weight: 800; font-size: clamp(28px, 3.4vw, 40px); line-height: 1.05\">{{cur.title}}<\u002Fh3>\n            <p style=\"margin: 0; font-size: 19px\">{{cur.desc}}<\u002Fp>\n          <\u002Fdiv>\n          <button class=\"ix-btn\" type=\"button\" sc-camel-on-click=\"{{next}}\" style=\"flex: 0 0 auto; font: 800 15px Nunito, sans-serif; color: #1C1B3A; background: #fff; border: 2px solid #1C1B3A; cursor: pointer; padding: 14px 22px; border-radius: 16px; box-shadow: 0 4px 0 #1C1B3A; min-height: 48px\">{{nextLabel}}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ===================== FRENTES: bento ===================== -->\n    <section id=\"frentes\" style=\"max-width: 1200px; margin: 0 auto; padding: clamp(40px, 6vw, 72px) clamp(16px, 4vw, 48px)\">\n      <div style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 40px; margin-bottom: 36px\">\n        <div style=\"flex: 1 1 460px; min-width: 0\">\n          <p style=\"margin: 0 0 12px; font-weight: 800; font-size: 14px; letter-spacing: .16em; text-transform: uppercase; color: #6A4CF5\">04 · O que reunimos<\u002Fp>\n          <h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', Nunito, sans-serif; font-weight: 800; font-size: clamp(34px, 4.6vw, 58px); line-height: 1.02; letter-spacing: -.02em\">Cinco peças. Formatos diferentes. Um só quadro.<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"flex: 1 1 300px; min-width: 0; margin: 0; font-size: 18px; color: #4A4870\">Nenhuma rede precisa adotar tudo de uma vez: as frentes se encaixam conforme a maturidade cresce.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px\">\n        <article style=\"background: #6A4CF5; color: #fff; border-radius: 32px; padding: 30px; min-height: 260px; display: flex; flex-direction: column; justify-content: space-between; gap: 24px; position: relative; overflow: hidden\">\n          <span aria-hidden=\"true\" style=\"position: absolute; right: -40px; top: -40px; width: 170px; height: 170px; border-radius: 50%; background: #8C74FF\"><\u002Fspan>\n          <span style=\"position: relative; font-weight: 800; font-size: 14px; letter-spacing: .12em; opacity: .85\">PEÇA 01<\u002Fspan>\n          <div style=\"position: relative\"><h3 style=\"margin: 0 0 8px; font-family: 'Bricolage Grotesque', Nunito, sans-serif; font-weight: 800; font-size: 28px; line-height: 1.08\">Diagnóstico e inteligência da rede<\u002Fh3><p style=\"margin: 0; color: #EAE5FF\">Mais visibilidade sobre a realidade da Educação Especial Inclusiva para apoiar decisões de gestão.<\u002Fp><\u002Fdiv>\n        <\u002Farticle>\n        <article style=\"background: #FFC53D; color: #1C1B3A; border-radius: 32px; padding: 30px; min-height: 260px; display: flex; flex-direction: column; justify-content: space-between; gap: 24px; position: relative; overflow: hidden\">\n          <span aria-hidden=\"true\" style=\"position: absolute; right: -10px; top: -10px; width: 150px; height: 150px; border-radius: 0 0 0 150px; background: #FFD872\"><\u002Fspan>\n          <span style=\"position: relative; font-weight: 800; font-size: 14px; letter-spacing: .12em; opacity: .75\">PEÇA 02<\u002Fspan>\n          <div style=\"position: relative\"><h3 style=\"margin: 0 0 8px; font-family: 'Bricolage Grotesque', Nunito, sans-serif; font-weight: 800; font-size: 28px; line-height: 1.08\">Consultoria e desenvolvimento institucional<\u002Fh3><p style=\"margin: 0\">Apoio para organizar prioridades, fortalecer políticas e evoluir as práticas da rede.<\u002Fp><\u002Fdiv>\n        <\u002Farticle>\n        <article style=\"background: #3DDBB8; color: #1C1B3A; border-radius: 32px; padding: 30px; min-height: 260px; display: flex; flex-direction: column; justify-content: space-between; gap: 24px; position: relative; overflow: hidden\">\n          <span aria-hidden=\"true\" style=\"position: absolute; right: 20px; top: 20px; width: 110px; height: 110px; border-radius: 22px; background: #7BE8CF; transform: rotate(18deg)\"><\u002Fspan>\n          <span style=\"position: relative; font-weight: 800; font-size: 14px; letter-spacing: .12em; opacity: .75\">PEÇA 03<\u002Fspan>\n          <div style=\"position: relative\"><h3 style=\"margin: 0 0 8px; font-family: 'Bricolage Grotesque', Nunito, sans-serif; font-weight: 800; font-size: 28px; line-height: 1.08\">Formação e desenvolvimento profissional<\u002Fh3><p style=\"margin: 0\">Aprendizagem contínua para os diferentes profissionais da comunidade escolar.<\u002Fp><\u002Fdiv>\n        <\u002Farticle>\n        <article style=\"background: #FF6B4A; color: #1C1B3A; border-radius: 32px; padding: 30px; min-height: 260px; display: flex; flex-direction: column; justify-content: space-between; gap: 24px; position: relative; overflow: hidden\">\n          <span aria-hidden=\"true\" style=\"position: absolute; right: -30px; top: 10px; width: 190px; height: 95px; border-radius: 190px 190px 0 0; background: #FF9277\"><\u002Fspan>\n          <span style=\"position: relative; font-weight: 800; font-size: 14px; letter-spacing: .12em; opacity: .75\">PEÇA 04<\u002Fspan>\n          <div style=\"position: relative\"><h3 style=\"margin: 0 0 8px; font-family: 'Bricolage Grotesque', Nunito, sans-serif; font-weight: 800; font-size: 28px; line-height: 1.08\">Ecossistema digital do estudante<\u002Fh3><p style=\"margin: 0\">Os atores da trajetória educacional conectados, com planejamento, acompanhamento e continuidade.<\u002Fp><\u002Fdiv>\n        <\u002Farticle>\n        <article style=\"background: #1C1B3A; color: #fff; border-radius: 32px; padding: 30px; min-height: 260px; display: flex; flex-direction: column; justify-content: space-between; gap: 24px; position: relative; overflow: hidden\">\n          <span aria-hidden=\"true\" style=\"position: absolute; right: 24px; top: 24px; width: 0; height: 0; border-left: 60px solid transparent; border-right: 60px solid transparent; border-bottom: 104px solid #FF9EC7; transform: rotate(12deg)\"><\u002Fspan>\n          <span style=\"position: relative; font-weight: 800; font-size: 14px; letter-spacing: .12em; opacity: .8\">PEÇA 05<\u002Fspan>\n          <div style=\"position: relative\"><h3 style=\"margin: 0 0 8px; font-family: 'Bricolage Grotesque', Nunito, sans-serif; font-weight: 800; font-size: 28px; line-height: 1.08\">Acompanhamento e reconhecimento<\u002Fh3><p style=\"margin: 0; color: #D9D4FF\">A evolução da rede acompanhada, e as iniciativas comprometidas com a inclusão valorizadas.<\u002Fp><\u002Fdiv>\n        <\u002Farticle>\n        <article style=\"background: transparent; border: 3px dashed #BDB5EE; border-radius: 32px; padding: 30px; min-height: 260px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 12px\">\n          <span aria-hidden=\"true\" style=\"display: flex; gap: 6px\"><span style=\"width: 22px; height: 22px; border-radius: 50%; background: #6A4CF5\"><\u002Fspan><span style=\"width: 22px; height: 22px; border-radius: 5px; background: #3DDBB8\"><\u002Fspan><span style=\"width: 22px; height: 22px; border-radius: 22px 22px 0 0; background: #FF6B4A\"><\u002Fspan><\u002Fspan>\n          <h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', Nunito, sans-serif; font-weight: 800; font-size: 26px; line-height: 1.1\">Comece por uma peça.<\u002Fh3>\n          <p style=\"margin: 0; color: #4A4870\">A rede escolhe por onde entrar e vai encaixando as outras ao longo do tempo.<\u002Fp>\n        <\u002Farticle>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ===================== ESTUDANTE: órbita ===================== -->\n    <section id=\"estudante\" style=\"max-width: 1200px; margin: 0 auto; padding: clamp(40px, 6vw, 72px) clamp(16px, 4vw, 48px)\">\n      <div style=\"display: flex; flex-wrap: wrap-reverse; align-items: center; gap: clamp(32px, 5vw, 72px)\">\n        <div style=\"flex: 1 1 400px; min-width: 0; display: flex; justify-content: center\">\n          <div role=\"img\" aria-label=\"O estudante no centro, cercado por escola, AEE, professores, família e gestão\" style=\"position: relative; width: min(100%, 460px); aspect-ratio: 1\">\n            <span class=\"ix-anim\" aria-hidden=\"true\" style=\"position: absolute; inset: 4%; border-radius: 50%; border: 3px dashed #BDB5EE; animation: ix-spin 60s linear infinite\"><\u002Fspan>\n            <span aria-hidden=\"true\" style=\"position: absolute; inset: 22%; border-radius: 50%; background: #EAE5FF\"><\u002Fspan>\n            <span style=\"position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 34%; aspect-ratio: 1; border-radius: 50%; background: #6A4CF5; color: #fff; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(16px, 2vw, 22px); box-shadow: 0 0 0 10px rgba(106,76,245,.18)\">Estudante<\u002Fspan>\n            <span style=\"position: absolute; left: 50%; top: 4%; transform: translate(-50%, -50%); padding: 10px 16px; border-radius: 999px; background: #FFC53D; color: #1C1B3A; font-weight: 800; font-size: 15px; box-shadow: 0 4px 0 #C98F00\">Escola<\u002Fspan>\n            <span style=\"position: absolute; left: 93.7%; top: 35.8%; transform: translate(-50%, -50%); padding: 10px 16px; border-radius: 8px; background: #3DDBB8; color: #1C1B3A; font-weight: 800; font-size: 15px; box-shadow: 0 4px 0 #1E9C80\">AEE<\u002Fspan>\n            <span style=\"position: absolute; left: 77%; top: 87.2%; transform: translate(-50%, -50%); padding: 10px 16px; border-radius: 999px; background: #FF6B4A; color: #1C1B3A; font-weight: 800; font-size: 15px; box-shadow: 0 4px 0 #C9431F\">Família<\u002Fspan>\n            <span style=\"position: absolute; left: 23%; top: 87.2%; transform: translate(-50%, -50%); padding: 10px 16px; border-radius: 8px; background: #FF9EC7; color: #1C1B3A; font-weight: 800; font-size: 15px; box-shadow: 0 4px 0 #D9669A\">Professores<\u002Fspan>\n            <span style=\"position: absolute; left: 6.3%; top: 35.8%; transform: translate(-50%, -50%); padding: 10px 16px; border-radius: 999px; background: #1C1B3A; color: #fff; font-weight: 800; font-size: 15px; box-shadow: 0 4px 0 #000\">Gestão<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 400px; min-width: 0\">\n          <p style=\"margin: 0 0 12px; font-weight: 800; font-size: 14px; letter-spacing: .16em; text-transform: uppercase; color: #6A4CF5\">05 · O estudante no centro<\u002Fp>\n          <h2 style=\"margin: 0 0 18px; font-family: 'Bricolage Grotesque', Nunito, sans-serif; font-weight: 800; font-size: clamp(34px, 4.6vw, 58px); line-height: 1.02; letter-spacing: -.02em\">Mais do que concentrar registros: colaborar.<\u002Fh2>\n          <p style=\"margin: 0 0 24px; font-size: 18px; color: #4A4870\">A tecnologia acompanha o estudante por todo o percurso escolar, articulando quem está em volta dele e mantendo as informações relevantes nos momentos de transição.<\u002Fp>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px\">\n            <span style=\"background: #fff; border: 2px solid #E4E0F7; border-radius: 16px; padding: 14px 16px; font-weight: 800\">Planejamento educacional<\u002Fspan>\n            <span style=\"background: #fff; border: 2px solid #E4E0F7; border-radius: 16px; padding: 14px 16px; font-weight: 800\">Organização dos apoios<\u002Fspan>\n            <span style=\"background: #fff; border: 2px solid #E4E0F7; border-radius: 16px; padding: 14px 16px; font-weight: 800\">Evolução acompanhada<\u002Fspan>\n            <span style=\"background: #fff; border: 2px solid #E4E0F7; border-radius: 16px; padding: 14px 16px; font-weight: 800\">Continuidade nas transições<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ===================== PARA QUEM: abas ===================== -->\n    <section id=\"valor\" style=\"max-width: 1200px; margin: 0 auto; padding: clamp(40px, 6vw, 72px) clamp(16px, 4vw, 48px)\">\n      <p style=\"margin: 0 0 12px; font-weight: 800; font-size: 14px; letter-spacing: .16em; text-transform: uppercase; color: #6A4CF5\">06 · Para quem<\u002Fp>\n      <h2 style=\"margin: 0 0 30px; font-family: 'Bricolage Grotesque', Nunito, sans-serif; font-weight: 800; font-size: clamp(34px, 4.6vw, 58px); line-height: 1.02; letter-spacing: -.02em\">Cada participante ganha uma peça.<\u002Fh2>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px\">\n        <sc-for list=\"{{aud}}\" as=\"a\" hint-placeholder-count=\"5\">\n          <button class=\"ix-btn\" type=\"button\" sc-camel-on-click=\"{{a.pick}}\" aria-pressed=\"{{a.pressed}}\" style=\"{{a.tabStyle}}\">{{a.label}}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"{{curAud.panelStyle}}\">\n        <span aria-hidden=\"true\" style=\"{{curAud.shape}}\"><\u002Fspan>\n        <div style=\"flex: 1 1 420px; min-width: 0\">\n          <p style=\"margin: 0 0 8px; font-weight: 800; font-size: 14px; letter-spacing: .16em; text-transform: uppercase; opacity: .8\">{{curAud.label}}<\u002Fp>\n          <p style=\"margin: 0; font-family: 'Bricolage Grotesque', Nunito, sans-serif; font-weight: 700; font-size: clamp(26px, 3.2vw, 40px); line-height: 1.12\">{{curAud.text}}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ===================== DIFERENCIAIS ===================== -->\n    <section id=\"diferenciais\" style=\"max-width: 1200px; margin: 0 auto; padding: clamp(40px, 6vw, 72px) clamp(16px, 4vw, 48px)\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: clamp(24px, 4vw, 64px); align-items: flex-start\">\n        <div style=\"flex: 1 1 300px; min-width: 0\">\n          <p style=\"margin: 0 0 12px; font-weight: 800; font-size: 14px; letter-spacing: .16em; text-transform: uppercase; color: #6A4CF5\">07 · Diferenciais<\u002Fp>\n          <h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', Nunito, sans-serif; font-weight: 800; font-size: clamp(34px, 4.6vw, 58px); line-height: 1.02; letter-spacing: -.02em\">Por que esta proposta é diferente.<\u002Fh2>\n        <\u002Fdiv>\n        <ol style=\"flex: 2 1 560px; min-width: 0; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column\">\n          <li style=\"display: flex; gap: 22px; align-items: baseline; padding: 20px 0; border-top: 2px solid #1C1B3A\"><span style=\"flex: 0 0 64px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 36px; color: #6A4CF5\">01<\u002Fspan><div><h3 style=\"margin: 0 0 4px; font-family: 'Bricolage Grotesque', Nunito, sans-serif; font-weight: 800; font-size: 24px\">Visão de ecossistema<\u002Fh3><p style=\"margin: 0; color: #4A4870\">Gestão, formação, acompanhamento e experiência do estudante conectados.<\u002Fp><\u002Fdiv><\u002Fli>\n          <li style=\"display: flex; gap: 22px; align-items: baseline; padding: 20px 0; border-top: 2px solid #1C1B3A\"><span style=\"flex: 0 0 64px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 36px; color: #E0482A\">02<\u002Fspan><div><h3 style=\"margin: 0 0 4px; font-family: 'Bricolage Grotesque', Nunito, sans-serif; font-weight: 800; font-size: 24px\">Jornada progressiva<\u002Fh3><p style=\"margin: 0; color: #4A4870\">A rede começa pela sua realidade e amplia a atuação com o tempo.<\u002Fp><\u002Fdiv><\u002Fli>\n          <li style=\"display: flex; gap: 22px; align-items: baseline; padding: 20px 0; border-top: 2px solid #1C1B3A\"><span style=\"flex: 0 0 64px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 36px; color: #13896F\">03<\u002Fspan><div><h3 style=\"margin: 0 0 4px; font-family: 'Bricolage Grotesque', Nunito, sans-serif; font-weight: 800; font-size: 24px\">Foco na prática<\u002Fh3><p style=\"margin: 0; color: #4A4870\">Planejamento, atuação dos profissionais e acompanhamento lado a lado.<\u002Fp><\u002Fdiv><\u002Fli>\n          <li style=\"display: flex; gap: 22px; align-items: baseline; padding: 20px 0; border-top: 2px solid #1C1B3A\"><span style=\"flex: 0 0 64px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 36px; color: #B37800\">04<\u002Fspan><div><h3 style=\"margin: 0 0 4px; font-family: 'Bricolage Grotesque', Nunito, sans-serif; font-weight: 800; font-size: 24px\">Inteligência para gestão<\u002Fh3><p style=\"margin: 0; color: #4A4870\">Informação que vira apoio real à tomada de decisão.<\u002Fp><\u002Fdiv><\u002Fli>\n          <li style=\"display: flex; gap: 22px; align-items: baseline; padding: 20px 0; border-top: 2px solid #1C1B3A; border-bottom: 2px solid #1C1B3A\"><span style=\"flex: 0 0 64px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 36px; color: #C2457E\">05<\u002Fspan><div><h3 style=\"margin: 0 0 4px; font-family: 'Bricolage Grotesque', Nunito, sans-serif; font-weight: 800; font-size: 24px\">Compromisso com evolução<\u002Fh3><p style=\"margin: 0; color: #4A4870\">Desenvolvimento institucional e melhoria contínua como parte do modelo.<\u002Fp><\u002Fdiv><\u002Fli>\n        <\u002Fol>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ===================== CARTAS NA MANGA ===================== -->\n    <section id=\"cartas\" style=\"margin-top: clamp(40px, 6vw, 72px); background: #1C1B3A; color: #fff; border-radius: 48px 48px 0 0; position: relative; overflow: hidden\">\n      <div aria-hidden=\"true\" style=\"position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.07) 1.5px, transparent 1.5px); background-size: 26px 26px\"><\u002Fdiv>\n      <div style=\"position: relative; max-width: 1200px; margin: 0 auto; padding: clamp(64px, 8vw, 110px) clamp(16px, 4vw, 48px) clamp(56px, 7vw, 90px)\">\n        <div style=\"text-align: center; max-width: 760px; margin: 0 auto 56px\">\n          <span style=\"display: inline-flex; align-items: center; gap: 10px; background: #FFC53D; color: #1C1B3A; font-weight: 800; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; padding: 8px 16px; border-radius: 999px\">Cartas na manga<\u002Fspan>\n          <h2 style=\"margin: 20px 0 16px; font-family: 'Bricolage Grotesque', Nunito, sans-serif; font-weight: 800; font-size: clamp(40px, 6vw, 76px); line-height: .98; letter-spacing: -.025em\">Ainda não contamos tudo.<\u002Fh2>\n          <p style=\"margin: 0; font-size: 19px; color: #D9D4FF\">Parte do projeto já está desenhada em detalhe. Abrimos estas cartas na conversa de alinhamento, com quem quiser construir junto.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 22px; align-items: start\">\n          <sc-for list=\"{{secrets}}\" as=\"c\" hint-placeholder-count=\"4\">\n            <div style=\"{{c.tilt}}\">\n              <article class=\"ix-card ix-shine\" style=\"background: #fff; color: #1C1B3A; border-radius: 26px; padding: 12px; box-shadow: 0 14px 30px -12px rgba(0,0,0,.55)\">\n                <div aria-hidden=\"true\" style=\"{{c.back}}\">\n                  <span style=\"width: 64px; height: rder-radius: 50%\"><\u002Fspan>\n              <span style=\"background: #3DDBB8; border-radius: 3px\"><\u002Fspan>\n              <span style=\"background: #8C74FF; border-radius: 0 0 999px 0\"><\u002Fspan>\n            <\u002Fspan>\n            <span style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 18px; letter-spacing: .04em\">INCLUSÃO<\u002Fspan>\n          <\u002Fa>\n          <p style=\"margin: 0; font-size: 14px; font-weight: 700; color: #B9B3F0\">© 2026 · Proposta conceitual para discussão com potenciais parceiros<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:6400}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { sel: 0, aud: 0, mix: 0 };\n  }\n  renderVals() {\n    var self = this;\n    var INK = '#1C1B3A';\n    var palette = ['#6A4CF5', '#FF6B4A', '#3DDBB8', '#FFC53D', '#FF9EC7', '#2E2C5C', '#F6F4FF'];\n    var shapes = [\n      'width:100%;height:100%;border-radius:50%',\n      'width:100%;height:50%;margin-top:50%;border-radius:999px 999px 0 0',\n      'width:100%;height:100%;border-radius:100% 0 0 0',\n      'width:100%;height:100%;border-radius:0 0 100% 0',\n      'width:70%;height:70%;border-radius:12px;transform:rotate(45deg)',\n      'width:100%;height:50%;border-radius:0 0 999px 999px',\n      'width:44%;height:44%;border-radius:50%',\n      'width:100%;height:100%;border-radius:0 100% 0 0',\n      'width:100%;height:34%;border-radius:999px'\n    ];\n    var mix = this.state.mix;\n    var tiles = [];\n    for (var i = 0; i < 16; i++) {\n      var cellC = palette[(i * 3 + mix * 2) % 6];\n      var shapeC = palette[(i * 5 + mix * 3 + 2) % 7];\n      if (shapeC === cellC) shapeC = palette[(i + 4) % 7];\n      var sh = shapes[(i * 7 + mix * 4) % shapes.length];\n      tiles.push({\n        cell: 'position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:' + cellC,\n        shape: 'display:block;flex:0 0 auto;background:' + shapeC + ';' + sh\n      });\n    }\n\n    var data = [\n      { title: 'Compreender', desc: 'Conhecer o contexto da rede: seus desafios, capacidades e oportunidades.', bg: '#6A4CF5', ink: '#fff', shape: 'border-radius:50%' },\n      { title: 'Planejar', desc: 'Transformar a leitura inicial em prioridades e objetivos de evolução.', bg: '#FF6B4A', ink: INK, shape: 'border-radius:100% 0 0 0' },\n      { title: 'Preparar', desc: 'Fortalecer pessoas, conhecimentos e condições para a prática inclusiva.', bg: '#3DDBB8', ink: INK, shape: 'border-radius:14px;transform:rotate(45deg) scale(.8)' },\n      { title: 'Conectar', desc: 'Integrar gestão, escolas, profissionais, estudantes e famílias.', bg: '#FFC53D', ink: INK, shape: 'border-radius:999px 999px 0 0' },\n      { title: 'Acompanhar', desc: 'Observar avanços, identificar oportunidades e apoiar decisões.', bg: '#FF9EC7', ink: INK, shape: 'border-radius:0 0 100% 0' },\n      { title: 'Reconhecer e evoluir', desc: 'Valorizar conquistas e manter um ciclo permanente de aprimoramento.', bg: INK, ink: '#fff', shape: 'border-radius:50% 50% 50% 0' }\n    ];\n    var sel = this.state.sel;\n    var steps = data.map(function (d, i) {\n      var on = i === sel;\n      var done = i < sel;\n      var bg = on ? d.bg : (done ? '#F1EEFF' : '#fff');\n      var col = on ? d.ink : INK;\n      return {\n        n: i + 1,\n        title: d.title,\n        pressed: on ? 'true' : 'false',\n        pick: function () { self.setState({ sel: i }); },\n        tileStyle: 'display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:22px;min-height:150px;padding:18px;border-radius:24px;cursor:pointer;font:inherit;text-align:left;background:' + bg + ';color:' + col + ';border:2px solid ' + (on ? INK : '#E4E0F7') + ';box-shadow:0 ' + (on ? 6 : 4) + 'px 0 ' + (on ? INK : '#E4E0F7'),\n        iconStyle: 'display:block;width:30px;height:30px;background:' + (on ? (d.ink === '#fff' ? '#fff' : INK) : d.bg) + ';' + d.shape\n      };\n    });\n    var c = data[sel];\n\n    var audData = [\n      { label: 'Secretarias', text: 'Visão mais integrada da rede, apoio ao planejamento e acompanhamento das iniciativas.', bg: '#6A4CF5', ink: '#fff', shape: 'border-radius:50%', sc: '#FFC53D' },\n      { label: 'Gestores escolares', text: 'Mais clareza para organizar equipes, processos e recursos.', bg: '#FFC53D', ink: INK, shape: 'border-radius:16px;transform:rotate(12deg)', sc: '#6A4CF5' },\n      { label: 'Professores e especialistas', text: 'Apoio à prática, desenvolvimento profissional e colaboração entre equipes.', bg: '#3DDBB8', ink: INK, shape: 'border-radius:999px 999px 0 0', sc: '#FF6B4A' },\n      { label: 'Estudantes', text: 'Uma trajetória mais articulada, com apoios educacionais acompanhados.', bg: '#FF6B4A', ink: INK, shape: 'border-radius:100% 0 0 0', sc: '#1C1B3A' },\n      { label: 'Famílias', text: 'Mais participação e comunicação com a escola.', bg: '#FF9EC7', ink: INK, shape: 'border-radius:50% 50% 50% 0', sc: '#6A4CF5' }\n    ];\n    var ai = this.state.aud;\n    var aud = audData.map(function (a, i) {\n      var on = i === ai;\n      return {\n        label: a.label,\n        pressed: on ? 'true' : 'false',\n        pick: function () { self.setState({ aud: i }); },\n        tabStyle: 'font:800 15px Nunito,sans-serif;cursor:pointer;padding:12px 20px;border-radius:999px;min-height:46px;border:2px solid ' + INK + ';background:' + (on ? INK : '#fff') + ';color:' + (on ? '#fff' : INK)\n      };\n    });\n    var ca = audData[ai];\n\n    var tilts = ['rotate(-6deg) translateY(18px)', 'rotate(-2deg)', 'rotate(2deg)', 'rotate(6deg) translateY(18px)'];\n    var backs = [\n      'background:#6A4CF5;background-image:radial-gradient(#8C74FF 22%, transparent 23%);background-size:22px 22px',\n      'background:#FF6B4A;background-image:repeating-linear-gradient(45deg,#FF8A6E 0 10px,transparent 10px 22px)',\n      'background:#3DDBB8;background-image:radial-gradient(circle at 0 0,#7BE8CF 30%,transparent 31%),radial-gradient(circle at 100% 100%,#7BE8CF 30%,transparent 31%);background-size:40px 40px',\n      'background:#FFC53D;background-image:linear-gradient(90deg,#FFD872 50%,transparent 50%),linear-gradient(#FFD872 50%,transparent 50%);background-size:26px 26px'\n    ];\n    var secrets = [\n      'Um índice próprio para medir a maturidade inclusiva da rede',\n      'Um programa de reconhecimento para escolas e redes',\n      'A arquitetura completa da plataforma',\n      'Roadmap e modelos de vendas'\n    ].map(function (t, i) {\n      return {\n        n: i + 1,\n        title: t,\n        tilt: 'transform:' + tilts[i],\n        back: 'height:170px;border-radius:18px;display:flex;align-items:center;justify-content:center;' + backs[i]\n      };\n    });\n\n    return {\n      tiles: tiles,\n      mix: function () { self.setState({ mix: (mix + 1) % 97 }); },\n      steps: steps,\n      progressStyle: 'display:block;height:100%;border-radius:999px;background:' + c.bg + ';width:' + Math.round((sel + 1) / 6 * 100) + '%;transition:width .4s',\n      cur: {\n        n: sel + 1,\n        title: c.title,\n        desc: c.desc,\n        panelStyle: 'margin-top:22px;display:flex;flex-wrap:wrap;gap:24px;align-items:center;padding:28px 30px;border-radius:28px;background:' + c.bg + ';color:' + c.ink,\n        bigShape: 'flex:0 0 auto;display:block;width:96px;height:96px;background:' + (c.ink === '#fff' ? '#fff' : INK) + ';' + c.shape\n      },\n      next: function () { self.setState({ sel: (sel + 1) % data.length }); },\n      nextLabel: sel === data.length - 1 ? 'Recomeçar o ciclo' : 'Próxima casa →',\n      aud: aud,\n      curAud: {\n        label: ca.label,\n        text: ca.text,\n        panelStyle: 'display:flex;flex-wrap:wrap;gap:28px;align-items:center;padding:clamp(26px,4vw,44px);border-radius:32px;min-height:200px;background:' + ca.bg + ';color:' + ca.ink,\n        shape: 'flex:0 0 auto;display:block;width:120px;height:120px;background:' + ca.sc + ';' + ca.shape\n      },\n      secrets: secrets\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
